{{define "main" -}}
<h1>Markers</h1>
<p>Each plan line starts with a marker that says where the item stands. Any other line is prose.</p>
<ul class="plan">
<li data-status="done">done that day</li>
<li data-status="later">done later, an older item resolved</li>
<li data-status="todo">to do</li>
<li data-status="dropped">dropped</li>
<li data-status="blocked">blocked or important</li>
<li data-status="idea">idea or question</li>
<li data-status="moved">moved to another day</li>
</ul>
{{- end}}
